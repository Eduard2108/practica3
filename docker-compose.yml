version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=unemi_db
      - POSTGRES_USER=unemi_user
      - POSTGRES_PASSWORD=unemi_password
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=unemi_db
      - DB_USER=unemi_user
      - DB_PASSWORD=unemi_password
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: